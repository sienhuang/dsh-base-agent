[project]
name = "dsh-base-agent"
version = "0.1.0"
description = "Company Agent application platform and control plane powered by DeepSeek Harness."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepseek-harness-sdk==0.1.2a3",
    "fastapi>=0.115,<1",
    "mcp>=1.28,<2",
    "pydantic>=2.12,<3",
    "python-dotenv>=1.1,<2",
    "uvicorn>=0.30,<1",
]

[project.scripts]
dsh-base-agent-server = "dsh_base_agent.server:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dsh_base_agent"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["dsh_base_agent"]
mypy_path = "src"
