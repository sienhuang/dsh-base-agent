[project]
name = "dsh-base-agent-starter"
version = "0.1.0"
description = "Copyable starter application built on dsh-base-agent."
requires-python = ">=3.12"
dependencies = [
    "dsh-base-agent==0.1.0",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
company-agent-server = "company_agent.app:main"
company-agent-worker = "company_agent.worker:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/company_agent"]

[tool.uv.sources]
dsh-base-agent = { path = "..", editable = true }

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.11",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["company_agent"]
